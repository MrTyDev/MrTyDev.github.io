<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>How the MCP server finds the current observability standard</title>
  <!--STYLE-->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="grid" d="M40 0H0V40"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="arrow-head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Content stays in the middle band (y 150-750) so both crops show it. -->
  <g transform="translate(70 330)">
    <rect class="box" width="300" height="200" rx="14" stroke-width="2"/>
    <circle class="soft-line" cx="150" cy="62" r="24" stroke-width="4"/>
    <path class="soft-line" d="M104 128c8-26 26-38 46-38s38 12 46 38" stroke-width="4" stroke-linecap="round"/>
    <text class="ink" x="150" y="168" font-size="26" font-weight="700" text-anchor="middle">Senior developer</text>
  </g>

  <g transform="translate(450 330)">
    <rect class="box" width="300" height="200" rx="14" stroke-width="2"/>
    <text class="ink" x="150" y="88" font-size="30" font-weight="700" text-anchor="middle">AI assistant</text>
    <text class="soft" x="150" y="128" font-size="22" text-anchor="middle">Claude or GPT</text>
  </g>

  <g transform="translate(830 310)">
    <rect class="accent" width="320" height="240" rx="14" stroke-width="2"/>
    <text class="on-accent" x="160" y="72" font-size="30" font-weight="700" text-anchor="middle">MCP server</text>
    <rect class="chip" x="34" y="102" width="252" height="40" rx="8"/>
    <text class="on-accent" x="160" y="129" font-size="20" text-anchor="middle">tools</text>
    <rect class="chip" x="34" y="154" width="252" height="40" rx="8"/>
    <text class="on-accent" x="160" y="181" font-size="20" text-anchor="middle">tuned instructions</text>
  </g>

  <g transform="translate(1240 212)">
    <text class="soft" x="145" y="0" font-size="20" text-anchor="middle">Observability docs</text>
    <g class="doc" stroke-width="2">
      <rect x="20" y="28" width="250" height="62" rx="8"/>
      <rect x="20" y="104" width="250" height="62" rx="8"/>
      <rect x="20" y="318" width="250" height="62" rx="8"/>
      <rect x="20" y="394" width="250" height="62" rx="8"/>
    </g>
    <g class="doc-text" font-size="19">
      <text x="44" y="66">outdated</text>
      <text x="44" y="142">outdated</text>
      <text x="44" y="356">outdated</text>
      <text x="44" y="432">outdated</text>
    </g>
    <g class="cross" stroke-width="2.5" stroke-linecap="round">
      <path d="M200 46l40 26M240 46l-40 26"/>
      <path d="M200 122l40 26M240 122l-40 26"/>
      <path d="M200 336l40 26M240 336l-40 26"/>
      <path d="M200 412l40 26M240 412l-40 26"/>
    </g>
    <rect class="card" x="20" y="230" width="250" height="62" rx="8"/>
    <text class="card-text" x="44" y="269" font-size="20" font-weight="700">current standard</text>
    <rect class="amber-line" x="10" y="220" width="270" height="82" rx="6" stroke-width="4"/>
    <rect class="amber" x="8" y="188" width="232" height="32" rx="4"/>
    <text class="amber-text" x="18" y="211" font-size="19" font-family="IBM Plex Mono, Menlo, monospace">up_to_date 0.98</text>
  </g>

  <g class="arrow" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M376 410H442"/>
    <path d="M756 410H822"/>
    <path d="M1156 473H1240"/>
  </g>
  <path class="amber-line" d="M1385 676V704H220V538" stroke-width="3.5" stroke-dasharray="10 9" marker-end="url(#arrow-amber)"/>
  <text class="note" x="800" y="740" font-size="22" text-anchor="middle">the current standard, implemented in the developer’s project</text>
</svg>
