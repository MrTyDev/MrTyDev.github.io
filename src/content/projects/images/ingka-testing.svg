<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>How the MCP server was tested: five levels of prompt specificity and a refinement loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c9c3ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#17163a"/>

  <!-- Left: the five ways a developer might ask -->
  <text x="70" y="96" fill="#fff" font-size="32" font-weight="700">Five ways to ask</text>
  <text x="70" y="134" fill="#c9c3ff" font-size="20">Every model was tested from very specific to very vague. Example phrasings.</text>

  <g font-size="22">
    <g transform="translate(70 180)">
      <rect width="820" height="96" rx="12" fill="#6b4fd8"/>
      <text x="28" y="40" fill="#e3ddff" font-size="17">1 · very specific</text>
      <text x="28" y="74" fill="#fff">“Use the docs tool to get the current tracing standard.”</text>
    </g>
    <g transform="translate(70 290)">
      <rect width="760" height="96" rx="12" fill="#5a45b8"/>
      <text x="28" y="40" fill="#e3ddff" font-size="17">2</text>
      <text x="28" y="74" fill="#fff">“Find the current tracing standard for my service.”</text>
    </g>
    <g transform="translate(70 400)">
      <rect width="700" height="96" rx="12" fill="#4a3b98"/>
      <text x="28" y="40" fill="#e3ddff" font-size="17">3</text>
      <text x="28" y="74" fill="#fff">“How do I add tracing to this service?”</text>
    </g>
    <g transform="translate(70 510)">
      <rect width="640" height="96" rx="12" fill="#3b3278"/>
      <text x="28" y="40" fill="#e3ddff" font-size="17">4</text>
      <text x="28" y="74" fill="#fff">“Make this service observable.”</text>
    </g>
    <g transform="translate(70 620)">
      <rect width="580" height="96" rx="12" fill="#2d2860"/>
      <text x="28" y="40" fill="#c9c3ff" font-size="17">5 · very vague</text>
      <text x="28" y="74" fill="#fff">“Something is wrong, help me fix it.”</text>
    </g>
  </g>

  <!-- Right: the refinement loop -->
  <text x="1010" y="96" fill="#fff" font-size="32" font-weight="700">The refinement loop</text>
  <text x="1010" y="134" fill="#c9c3ff" font-size="20">Repeated until the numbers stopped improving.</text>

  <g transform="translate(1250 440)">
    <circle r="190" fill="none" stroke="#4a4790" stroke-width="2" stroke-dasharray="6 8"/>
    <!-- three steps on the circle -->
    <g transform="translate(0 -190)">
      <rect x="-180" y="-46" width="360" height="92" rx="14" fill="#6b4fd8"/>
      <text y="-6" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Test</text>
      <text y="24" fill="#e3ddff" font-size="16" text-anchor="middle">right tool? accurate? understood the ask?</text>
    </g>
    <g transform="translate(165 95)">
      <rect x="-120" y="-46" width="240" height="92" rx="14" fill="#25244f" stroke="#8f7aff" stroke-width="2"/>
      <text y="-6" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Compare</text>
      <text y="24" fill="#c9c3ff" font-size="17" text-anchor="middle">several models</text>
    </g>
    <g transform="translate(-165 95)">
      <rect x="-120" y="-46" width="240" height="92" rx="14" fill="#25244f" stroke="#8f7aff" stroke-width="2"/>
      <text y="-6" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Refine</text>
      <text y="24" fill="#c9c3ff" font-size="17" text-anchor="middle">MCP instructions</text>
    </g>
    <g stroke="#c9c3ff" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M140 -138 A190 190 0 0 1 188 30"/>
      <path d="M48 160 A190 190 0 0 1 -48 160"/>
      <path d="M-188 30 A190 190 0 0 1 -140 -138"/>
    </g>
  </g>

  <g transform="translate(1010 740)">
    <rect width="520" height="58" rx="8" fill="#ff9f1c"/>
    <text x="22" y="37" fill="#1b1300" font-size="21" font-weight="700">Best at picking the right tool: Claude</text>
  </g>
  <text x="1010" y="836" fill="#8a86c4" font-size="17">Our own metrics. The details are under NDA.</text>
</svg>
